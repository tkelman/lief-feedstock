{% set version = "1.0.0" %}

package:
  name: lief
  version: {{ version }}

source:
  - url: https://github.com/lief-project/LIEF/archive/{{ version }}.tar.gz
    sha256: 2cf412695ff739d82e129db441e5c2025f3bb4873a3d3a1d3dd4cf300b682abd
    patches:
      # Remove after a release containing https://github.com/lief-project/LIEF/pull/1375
      - patches/0001-avoid-major-minor-macro-collisions.patch

build:
  # pydantic-core skips free-threaded Python 3.14 on these QEMU targets.
  skip: true  # [is_freethreading and (aarch64 or ppc64le)]
  number: 5

requirements:
  build:
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
    - ccache  # [build_platform != 'win-arm64']
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - pkg-config            # [not win]
    - cmake
    - ninja
  host:
    - fmt
    - nlohmann_json
    # LIEF 1.0.0 requires exactly MbedTLS 4.0.0, which is not available on
    # linux-riscv64. Use LIEF's bundled copy there until a compatible package exists.
    - mbedtls 4.0.0  # [not riscv64]
    - spdlog

outputs:
  - name: py-lief
    script: |-
      install-py-lief.sh  # [unix]
      install-py-lief.bat  # [win]
    build:
      run_exports:
        - {{ pin_subpackage('py-lief', max_pin='x.x') }}
      ignore_run_exports:
        - python
    requirements:
      build:
        - ccache  # [build_platform != 'win-arm64']
        - {{ stdlib('c') }}
        - {{ compiler('c') }}
        - {{ compiler('cxx') }}
        - pkg-config            # [not win]
        - cmake
        - ninja
        - python                                 # [build_platform != target_platform]
        - cross-python_{{ target_platform }}     # [build_platform != target_platform]
        - pydantic >=2.13.4                      # [build_platform != target_platform]
        - pydantic-core >=2.46.4                 # [build_platform != target_platform]
        - scikit-build-core >=1.0.3              # [build_platform != target_platform]
        - setuptools >=83.0.0                    # [build_platform != target_platform]
        - tomli >=2.4.1                          # [build_platform != target_platform]
      host:
        - fmt
        - nlohmann_json
        # Dynamically linked to libLIEF for now; see comment in patch section.
        - {{ pin_subpackage('liblief', exact=True) }}
        - python
        - pip
        # Upstream pins build dependencies exactly; we are a bit more lenient
        # here to avoid potential solvability issues.
        - pydantic >=2.13.4
        - pydantic-core >=2.46.4
        - scikit-build-core >=1.0.3
        - setuptools >=83.0.0
        - spdlog
        - tomli >=2.4.1
      run:
        - {{ pin_subpackage('liblief', exact=True) }}
        - python
    test:
      requires:
        - {{ compiler('cxx') }}
      imports:
        - lief
      commands:
        # Test general functionality by introspecting inter-subpackage linkage.
        - python -c "import ctypes.util, lief; missing = {name for name in {s.name for s in lief.parse(lief._lief.__file__).imported_functions} - {s.name for s in lief.parse(ctypes.util.find_library('LIEF')).exported_functions} if '4LIEF' in name}; assert not missing, missing"

  - name: liblief
    script: |-
      install-liblief.sh  # [unix]
      install-liblief.bat  # [win]
    build:
      run_exports:
        - {{ pin_subpackage('liblief', max_pin='x.x') }}
    requirements:
      build:
        - ccache  # [build_platform != 'win-arm64']
        - {{ stdlib('c') }}
        - {{ compiler('c') }}
        - {{ compiler('cxx') }}
        - pkg-config            # [not win]
        - cmake
        - ninja
      host:
        - fmt
        - nlohmann_json
        - mbedtls 4.0.0  # [not riscv64]
        - spdlog
    test:
      files:
        - tests
      commands:
        - set -x   # [not win]
        - echo on  # [win]
        - pushd tests
        # Aid uniform tests below: Put current dir bluntly on PATH; alias "findstr"->"grep", "call;"->"true".
        - PATH=".:${PATH}"            # [not win]
        - findstr() { grep "${@}"; }  # [not win]
        - call() { true; }            # [not win]

        - pushd self
        - cmake -G "Ninja" -DCMAKE_BUILD_TYPE=Debug . || exit 1
        - ninja || exit 1
        # FIXME: Actual test disabled on Windows for now; LIEF::Parser::parse does not finish on Windows.
        - test-lief-self || exit 1  # [not win]
        - popd

        - pushd spdlog
        # Match the Release MSVC runtime used by the packaged LIEF and spdlog
        # DLLs because set_logger passes a std::shared_ptr across that ABI.
        - cmake -G "Ninja" -DCMAKE_BUILD_TYPE=Release . || exit 1
        - ninja || exit 1
        - test-lief-spdlog || exit 1
        - popd

        - pushd macho
        - cmake -G "Ninja" -DCMAKE_BUILD_TYPE=Debug . || exit 1
        - ninja || exit 1
        # This MachO object has no DynamicSymbolCommand, testing for bug fixed in PR:
        # https://github.com/lief-project/LIEF/pull/262
        # FIXME: Actual test disabled on Windows for now; LIEF::MachO::Parser::parse does not finish on Windows.
        - test-lief-macho macOS-libpython2.7.a-getbuildinfo.o > output.txt || exit 1  # [not win]
        - findstr has_dynamic_symbol_command output.txt && exit 1 || call;
        - popd

        - popd
      requires:
        - {{ compiler('c') }}
        - {{ compiler('cxx') }}
        - cmake
        - ninja

about:
  home: https://lief.quarkslab.com/
  license: Apache-2.0
  license_file: LICENSE
  license_family: Apache
  summary: A cross platform library to parse, modify and abstract ELF, PE and MachO formats.
  description: |
    It turns out that many projects need to parse executable formats and they usually re-implement
    their own parser. Moreover these parsers are usually bound to one language.
    LIEF attempts to fill this void.
  dev_url: https://github.com/lief-project/LIEF
  doc_url: https://lief.quarkslab.com/doc/stable/index.html
  doc_source_url: https://github.com/lief-project/LIEF/tree/master/doc

extra:
  recipe-maintainers:
    - jeongseok-meta
    - isuruf
    - mbargull
    - msarahan
    - xhochy
    - wolfv
